name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Scratch, CI-only database - never the production database.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gradeflow_ci?schema=public"
  # Dummy secret, sufficient for build/tests. Real deployments must set
  # their own SESSION_SECRET (see .env.example) - never commit a real one.
  SESSION_SECRET: "ci-only-dummy-secret-not-used-in-production-0123456789"
  NODE_ENV: "test"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradeflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
